<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Northwind – Everyday carry</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#f3f5f8;--fg:#0e1220;--card:#fff;--ln:#0e122020;--ac:#2446e0;--on:#fff;--h:Manrope;--b:Manrope}@media(prefers-color-scheme:dark){:root{--bg:#0d111c;--fg:#eceefb;--card:#171c2c;--ln:#ffffff1f;--ac:#7b92ff;--on:#0d111c}}*{box-sizing:border-box;margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-behavior:smooth;scroll-padding-top:70px}body{background:var(--bg);color:var(--fg);font:17px/1.6 var(--b),system-ui,sans-serif;-webkit-font-smoothing:antialiased}h1,h2,h3{font-family:var(--h),system-ui,sans-serif;line-height:1.05;letter-spacing:-.02em}.w{max-width:1080px;margin:auto;padding:0 22px}header.n{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--ln)}header.n .w{display:flex;justify-content:space-between;align-items:center;height:62px}header.n b{font:700 20px var(--h),sans-serif}header.n a{color:inherit;text-decoration:none;margin-left:22px;font-size:15px;opacity:.8}.btn{display:inline-block;border:0;border-radius:10px;padding:13px 24px;font:600 15px system-ui,sans-serif;cursor:pointer;background:var(--ac);color:var(--on);text-decoration:none;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px color-mix(in srgb,var(--ac) 40%,transparent)}.btn.o{background:none;color:var(--fg);border:1.5px solid var(--ln)}:focus-visible{outline:3px solid var(--ac);outline-offset:2px}section{padding:84px 0}.g{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:24px;transition:transform .2s}.c:hover{transform:translateY(-4px)}.chip{border:1.5px solid var(--ln);background:none;color:var(--fg);border-radius:99px;padding:9px 18px;font:600 14px system-ui,sans-serif;cursor:pointer}.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--on)}.row{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}details{border-bottom:1px solid var(--ln);padding:18px 0}summary{cursor:pointer;font-weight:600}details p{opacity:.75;margin-top:8px}footer{border-top:1px solid var(--ln);padding:36px 0;opacity:.65;font-size:14px}.h{display:none!important}.mut{opacity:.7}h2{font-size:clamp(30px,5vw,46px);margin-bottom:10px}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}.hero{padding:80px 0 30px}.hero h1{font-size:clamp(42px,8vw,88px);font-weight:800}.hero p{font-size:19px;max-width:44ch;margin-top:16px;opacity:.8}.th{height:170px;border-radius:10px;display:grid;place-items:center;font-size:64px;margin-bottom:14px}.pr{font-weight:800;margin:4px 0 14px}.cat{font-size:13px;opacity:.6}#dr{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--card);z-index:40;padding:24px;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;border-left:1px solid var(--ln)}#dr.o{transform:none}.it{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln);gap:8px}.qb{width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);background:none;color:var(--fg);cursor:pointer}.bar{height:6px;background:var(--ln);border-radius:9px;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}</style></head><body><header class="n"><div class="w"><b>Northwind</b><nav><a href="#sh">Shop</a><button class="chip" id="oc">Cart (<span id="cn">0</span>)</button></nav></div></header>
