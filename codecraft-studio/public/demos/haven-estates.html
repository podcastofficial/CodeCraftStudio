<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Haven Estates – Find your next home</title><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet"><style>:root{--bg:#f7f6f2;--fg:#17302e;--card:#fff;--ln:#17302e24;--ac:#0f6b63;--on:#fff;--h:"DM Serif Display";--b:"DM Sans"}@media(prefers-color-scheme:dark){:root{--bg:#0e1a19;--fg:#e6efed;--card:#162624;--ln:#ffffff22;--ac:#46c4b6;--on:#0e1a19}}*{box-sizing:border-box;margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-behavior:smooth;scroll-padding-top:70px}body{background:var(--bg);color:var(--fg);font:17px/1.6 var(--b),system-ui,sans-serif;-webkit-font-smoothing:antialiased}h1,h2,h3{font-family:var(--h),system-ui,sans-serif;line-height:1.05;letter-spacing:-.02em}.w{max-width:1080px;margin:auto;padding:0 22px}header.n{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--ln)}header.n .w{display:flex;justify-content:space-between;align-items:center;height:62px}header.n b{font:700 20px var(--h),sans-serif}header.n a{color:inherit;text-decoration:none;margin-left:22px;font-size:15px;opacity:.8}.btn{display:inline-block;border:0;border-radius:10px;padding:13px 24px;font:600 15px system-ui,sans-serif;cursor:pointer;background:var(--ac);color:var(--on);text-decoration:none;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px color-mix(in srgb,var(--ac) 40%,transparent)}.btn.o{background:none;color:var(--fg);border:1.5px solid var(--ln)}:focus-visible{outline:3px solid var(--ac);outline-offset:2px}section{padding:84px 0}.g{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:24px;transition:transform .2s}.c:hover{transform:translateY(-4px)}.chip{border:1.5px solid var(--ln);background:none;color:var(--fg);border-radius:99px;padding:9px 18px;font:600 14px system-ui,sans-serif;cursor:pointer}.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--on)}.row{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}details{border-bottom:1px solid var(--ln);padding:18px 0}summary{cursor:pointer;font-weight:600}details p{opacity:.75;margin-top:8px}footer{border-top:1px solid var(--ln);padding:36px 0;opacity:.65;font-size:14px}.h{display:none!important}.mut{opacity:.7}h2{font-size:clamp(30px,5vw,46px);margin-bottom:10px}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}.hero{padding:80px 0 20px}.hero h1{font-size:clamp(44px,9vw,104px);font-weight:400}.hero p{margin-top:16px;font-size:19px;max-width:44ch;opacity:.8}.fb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:26px 0}select,input,textarea{padding:11px 14px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}.im{height:170px;border-radius:10px;margin-bottom:14px;display:grid;place-items:center;font-size:60px}.pr{font:400 28px "DM Serif Display"}.mt{opacity:.7;font-size:14px;margin:4px 0 14px}dialog{border:0;border-radius:16px;padding:26px;background:var(--card);color:var(--fg);width:min(420px,92%)}dialog::backdrop{background:#000a}form{display:grid;gap:12px;margin-top:14px}</style></head><body><header class="n"><div class="w"><b>Haven Estates</b><nav><a href="#ls">Listings</a></nav></div></header>
<div class="hero"><div class="w"><h1>Homes worth coming back to.</h1><p>Hand-picked apartments and houses in New York, London and Dubai.</p></div></div>
<section id="ls" style="padding-top:20px"><div class="w"><div class="fb"><span id="f" class="row" style="margin:0"></span><select id="sb" aria-label="Sort"><option value="0">Sort: featured</option><option value="1">Price: low to high</option><option value="2">Price: high to low</option></select></div><p class="mut" id="ct"></p><div class="g" id="l" style="margin-top:14px"></div></div></section>
<dialog id="dg"><h3 id="dt"></h3><form id="fm"><input id="nm" placeholder="Your name" required><input id="em" type="email" placeholder="Email" required><textarea placeholder="Message (optional)" rows="3"></textarea><button class="btn">Request viewing</button><button type="button" class="btn o" id="cl">Close</button></form><p id="ok" class="h" style="margin-top:12px;color:var(--ac);font-weight:600"></p></dialog>
<footer><div class="w">© 2026 Haven Estates · Demo listings by CodeCraft Studio. Not real properties.</div></footer><script>var L=[['Hudson Loft','New York','$',1250000,2,'🏙️','#cfe3e0'],['Brooklyn Brownstone','New York','$',2100000,4,'🏠','#f0dcc8'],['Kensington Flat','London','£',980000,2,'🏢','#dcd6ee'],['Notting Hill Mews','London','£',1650000,3,'🏡','#f3d7dc'],['Marina Penthouse','Dubai','$',1900000,3,'🌆','#d3e6f5'],['Palm Villa','Dubai','$',3400000,5,'🌴','#dff0d4']],city='All';
function draw(){var a=L.filter(function(p){return city=='All'||p[1]==city});if(sb.value==1)a.sort(function(x,y){return x[3]-y[3]});if(sb.value==2)a.sort(function(x,y){return y[3]-x[3]});ct.textContent=a.length+' homes';
l.innerHTML=a.map(function(p){return '<div class="c"><div class="im" style="background:'+p[6]+'">'+p[5]+'</div><div class="pr">'+p[2]+p[3].toLocaleString('en-US')+'</div><h3 style="font-size:22px">'+p[0]+'</h3><div class="mt">'+p[1]+' · '+p[4]+' bedrooms</div><button class="btn o" data-n="'+p[0]+'">Enquire</button></div>'}).join('');
document.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){dt.textContent=b.dataset.n;ok.classList.add('h');fm.classList.remove('h');dg.showModal()}})}
['All','New York','London','Dubai'].forEach(function(k){var b=document.createElement('button');b.className='chip';b.textContent=k;b.setAttribute('aria-pressed',k=='All');b.onclick=function(){city=k;Array.prototype.forEach.call(f.children,function(x){x.setAttribute('aria-pressed',x===b)});draw()};f.appendChild(b)});
sb.onchange=draw;cl.onclick=function(){dg.close()};fm.onsubmit=function(e){e.preventDefault();fm.classList.add('h');ok.classList.remove('h');ok.textContent='Thanks '+nm.value+'. An agent will email you within a day (demo).'};draw()</script></body></html>
